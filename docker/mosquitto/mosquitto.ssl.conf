# Fleet Commander — production MQTT broker (P0 UC-24).
# Mutual TLS on 8883; identity = client cert CN (use_identity_as_username).
# The anonymous demo config stays in mosquitto.conf — do not merge.

listener 8883 0.0.0.0
protocol mqtt

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
crlfile /mosquitto/certs/ca.crl

require_certificate true
use_identity_as_username true
allow_anonymous false

acl_file /mosquitto/config/acl
max_connections 5000

persistence false
log_dest stdout
connection_messages true
