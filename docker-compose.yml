services:
  # ============================================================
  # Mosquitto MQTT Broker — DEMO/TESTING (anonymous, 1883)
  # ============================================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fleet-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-p", "1883", "-t", "healthcheck", "-m", "ok", "-q", "0"]
      interval: 10s
      retries: 5
      start_period: 15s
    profiles:
      - demo
      - testing

  # ============================================================
  # Mosquitto MQTT Broker — PRODUCTION (mTLS 8883, CRL, ACL)
  # ============================================================
  mosquitto-tls:
    image: eclipse-mosquitto:2
    container_name: fleet-mosquitto-tls
    ports:
      - "8883:8883"   # 1883 intentionally NOT published in production
    volumes:
      - ./docker/mosquitto/mosquitto.ssl.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/acl:/mosquitto/config/acl:ro
      - ./certs:/mosquitto/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt --cert /mosquitto/certs/fleet-backend.crt --key /mosquitto/certs/fleet-backend.key -t healthcheck -m ok -q 0"]
      interval: 10s
      retries: 5
      start_period: 15s
    profiles:
      - production

  # ============================================================
  # PostgreSQL Database (production) — UC-27
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleetpass
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 10s
      retries: 5
      start_period: 15s
    profiles:
      - production

  # ============================================================
  # Fleet Commander Backend — LEADER (owns MQTT loop + schedulers)
  #
  # Demo/testing: sqlite + anonymous MQTT via defaults.
  # Production:   .env supplies AUTH_MODE=strict, postgres URL,
  #               MQTT_TLS_ENABLED=true and broker port/host overrides.
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    container_name: fleet-backend
    ports:
      - "${HOST_PORT:-8181}:8000"
    environment:
      - ROLE=leader
      - AUTH_MODE=${AUTH_MODE:-open}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/fleet.db}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mosquitto}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_TLS_ENABLED=${MQTT_TLS_ENABLED:-false}
      - MQTT_CA_CERT=${MQTT_CA_CERT:-/app/certs/ca.crt}
      - MQTT_CLIENT_CERT=${MQTT_CLIENT_CERT:-/app/certs/fleet-backend.crt}
      - MQTT_CLIENT_KEY=${MQTT_CLIENT_KEY:-/app/certs/fleet-backend.key}
      - INTERNAL_CA_DIR=${INTERNAL_CA_DIR:-/app/certs}
      - DOCS_ENABLED=${DOCS_ENABLED:-true}
      - LOG_LEVEL=INFO
      - EXTERNAL_PORT=${HOST_PORT:-8181}
      - FIRMWARE_STORAGE_PATH=/app/firmware
      - OTA_TIMEOUT_SECONDS=120
      - MAX_RETRY_COUNT=3
      - OTA_FIRMWARE_BASE_URL=${OTA_FIRMWARE_BASE_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-to-a-random-secret}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminadmin}
    volumes:
      - firmware_data:/app/firmware
      - sqlite_data:/app/data
      - ./certs:/app/certs          # rw: backend regenerates ca.crl on revoke
      # NOTE (P0 UC-27): no depends_on on postgres/mosquitto-tls here — that
      # would auto-activate their production profiles during `--profile demo`.
      # The leader tolerates both being absent: DB init retries (lifespan)
      # and paho reconnects MQTT automatically.
    restart: unless-stopped
    healthcheck:
      # P0 UC-23 rule 4: /health is never auth-gated (unlike /devices).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5
      start_period: 20s

  # ============================================================
  # Fleet Commander API replicas — PRODUCTION HA (UC-27)
  # HTTP-only (ROLE=api): no MQTT loop, no schedulers. Scale with:
  #   docker compose --profile production up -d --scale backend-api=2
  # ============================================================
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    environment:
      - ROLE=api
      - AUTH_MODE=${AUTH_MODE:-strict}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://fleet:fleetpass@postgres:5432/fleet}
      - DOCS_ENABLED=${DOCS_ENABLED:-false}
      - LOG_LEVEL=INFO
      - FIRMWARE_STORAGE_PATH=/app/firmware
      - OTA_TIMEOUT_SECONDS=120
      - MAX_RETRY_COUNT=3
      - OTA_FIRMWARE_BASE_URL=${OTA_FIRMWARE_BASE_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-to-a-random-secret}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminadmin}
    volumes:
      - firmware_data:/app/firmware
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5
      start_period: 20s
    profiles:
      - production

  # ============================================================
  # Device Simulator (demo: anonymous; production: per-device mTLS)
  # ============================================================
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    container_name: fleet-simulator
    environment:
      # Shares broker vars with backend so profile switches stay consistent:
      # demo → mosquitto:1883 plain; production (.env) → mosquitto-tls:8883 TLS.
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mosquitto}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_TLS=${MQTT_TLS_ENABLED:-false}
      - MQTT_CA_CERT=/app/certs/ca.crt
      - MQTT_CLIENT_CERT_DIR=/app/certs/simulator
      - SIMULATOR_DEVICE_IDS=${SIMULATOR_DEVICE_IDS:-}
      - BACKEND_URL=http://backend:8000
      - SIMULATOR_DEVICE_COUNT=${SIMULATOR_DEVICE_COUNT:-5}
      - SIMULATOR_HEARTBEAT_INTERVAL=10
      - SIMULATOR_OTA_FAILURE_RATE=0.2
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      # Broker deps omitted: simulator tolerates broker absence via paho
      # auto-reconnect, and cross-profile depends_on would pull the wrong
      # broker into demo/production runs.
    restart: unless-stopped
    profiles:
      - demo
      - production

  # ============================================================
  # Prometheus (Metrics Collection)
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: fleet-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    profiles:
      - demo
      - testing

  # ============================================================
  # Grafana (Visualization)
  # ============================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: fleet-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    profiles:
      - demo
      - testing

  # ============================================================
  # E2E Tests (run once, then exit)
  # ============================================================
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    container_name: fleet-tests
    environment:
      - BASE_URL=http://backend:8000
      - TEST_DEVICE_COUNT=3
      - TEST_TIMEOUT=60
      - AUTH_MODE=${AUTH_MODE:-open}
      - FLEET_API_KEY=${FLEET_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - testing

volumes:
  pgdata:
  firmware_data:
  sqlite_data:
  prometheus_data:
  grafana_data:
