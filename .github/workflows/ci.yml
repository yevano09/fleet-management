name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: |
          pytest tests/test_aegis_unit.py tests/test_auth_rbac.py \
                 tests/test_config_unit.py tests/test_ml_eval.py \
                 tests/test_pki.py tests/test_session5_unit.py \
                 tests/test_simulator_unit.py tests/test_tenancy.py \
                 tests/test_v2g.py -v --tb=short

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start backend stack
        run: docker compose --profile testing up --build -d backend mosquitto
      - name: Wait for backend healthy
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8000/health > /dev/null 2>&1; do sleep 2; done'
      - name: Run E2E tests
        run: docker compose --profile testing run --rm --build tests
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
